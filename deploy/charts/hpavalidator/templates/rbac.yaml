apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hpavalidator.fullname" . }}
  labels:
    {{- include "hpavalidator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ops.zvikanaparstek.dev"]
    resources: ["hpareplicaalerts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hpavalidator.fullname" . }}
  labels:
    {{- include "hpavalidator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hpavalidator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hpavalidator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
