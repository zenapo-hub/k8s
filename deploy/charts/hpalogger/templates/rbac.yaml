{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hpalogger.fullname" . }}
  labels:
    {{- include "hpalogger.labels" . | nindent 4 }}
rules:
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ops.zvikanaparstek.dev"]
    resources: ["hpareplicaalerts", "hpareplicaalerts/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hpalogger.fullname" . }}
  labels:
    {{- include "hpalogger.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hpalogger.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hpalogger.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
